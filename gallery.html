<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shirt Studio</title>
<style>
:root{--bg:#111114;--panel:#1b1b20;--panel2:#24242b;--ink:#ececf1;--mute:#9b9ba8;--line:#2f2f37;--acc:#ff5fa8;--up:#3ecf8e;--down:#ff6b5a;--warn:#f5b84b;--r:12px}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f3f2ee;--panel:#fff;--panel2:#f0efea;--ink:#1b1b1f;--mute:#5e5e6a;--line:#dddcd5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:inherit}
button,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--mute)}
button.on{border-color:var(--acc);color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#1a0010;font-weight:700}
button:disabled{opacity:.45;cursor:default}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px}
h1{font-size:18px;margin:0 8px 0 0;letter-spacing:.3px}h1 b{color:var(--acc)}
.tabs{display:flex;gap:4px}.tabs button{border-radius:99px}
.stats{color:var(--mute);font-size:13px;margin-left:auto}
.sw{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid var(--line)}
.sw.on{outline:2px solid var(--acc);outline-offset:2px}
.lbl{color:var(--mute);font-size:12px}
main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;position:relative}
.card.v1{border-color:var(--up)}.card.v-1{border-color:var(--down);opacity:.72}
.shirt{aspect-ratio:1;display:grid;place-items:center;padding:22px;cursor:zoom-in;transition:background .2s;overflow:hidden;min-height:0}
.shirt img{width:100%;height:100%;object-fit:contain;min-height:0}
.miss{color:#888;font-size:13px}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.title{font-weight:700;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.chip.sell{color:var(--up);border-color:var(--up)}.chip.personal{color:var(--acc);border-color:var(--acc)}.chip.new{color:var(--warn);border-color:var(--warn)}
.hook{color:var(--mute);font-size:12.5px}
.vote{display:flex;gap:6px;margin-top:auto}
.vote button{flex:1;font-size:15px;padding:7px 0}
.vote .up.on{background:var(--up);border-color:var(--up);color:#00180c}
.vote .down.on{background:var(--down);border-color:var(--down);color:#200500}
.vote .qa.on{background:var(--warn);border-color:var(--warn);color:#201400}
.note{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12.5px}
.more{display:flex;gap:6px}.more button{flex:1;font-size:12px;padding:4px 0}
.warnnote{font-size:12px;color:var(--warn)}
.mock canvas{width:100%;display:block;aspect-ratio:var(--ar);background:var(--panel2);cursor:zoom-in}
.mock .body{flex-direction:row;align-items:center;gap:8px}
.mock .title{flex:1;font-size:13px}
.empty{color:var(--mute);padding:40px;text-align:center}
/* focus */
#focus{position:fixed;inset:0;z-index:20;background:#0b0b0e;display:none;flex-direction:column;color:#eee}
#focus.open{display:flex}
.fhead{display:flex;gap:8px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.fhead .t{font-weight:700;font-size:16px;margin-right:auto}
.fbody{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 16px;min-height:0}
.fpane{display:grid;place-items:center;min-height:0;border-radius:var(--r);overflow:hidden}
.fpane img,.fpane canvas{max-width:100%;max-height:100%;object-fit:contain}
.fflat{padding:24px}
.ffoot{display:flex;gap:10px;justify-content:center;align-items:center;padding:12px 16px;flex-wrap:wrap}
.ffoot button{background:#222228;border-color:#3a3a44;color:#eee;min-width:110px;padding:10px 14px;font-size:15px}
.ffoot .up.on{background:var(--up);color:#00180c}.ffoot .down.on{background:var(--down);color:#200500}.ffoot .qa.on{background:var(--warn);color:#201400}
.ffoot input{background:#1b1b20;border:1px solid #3a3a44;border-radius:8px;padding:9px 10px;min-width:260px;color:#eee}
.keys{color:#888;font-size:12px;text-align:center;padding-bottom:10px}
#focus .hook{color:#aaa;max-width:900px;margin:0 auto;text-align:center;padding:0 16px}
/* taste */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.panel h3{margin:0 0 10px;font-size:14px;text-transform:capitalize}
.brow{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;font-size:12.5px;margin:3px 0}
.btrack{position:relative;height:12px;background:var(--panel2);border-radius:6px}
.btrack:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--mute)}
.bfill{position:absolute;top:0;bottom:0;border-radius:6px}
.bnum{color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.gen{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.slots{font-size:12.5px;color:var(--mute);margin:6px 0 0;padding-left:18px}
.log{font:12px/1.45 ui-monospace,Consolas,monospace;background:var(--panel2);border-radius:8px;padding:8px 10px;white-space:pre-wrap;max-height:260px;overflow:auto;margin-top:8px}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--acc);border-right-color:transparent;border-radius:50%;animation:s 1s linear infinite;margin-right:6px}
@keyframes s{to{transform:rotate(1turn)}}
.banner{background:var(--panel2);border:1px solid var(--warn);color:var(--ink);border-radius:8px;padding:8px 12px;margin:0 16px 10px;font-size:13px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none}
@media (max-width:760px){.fbody{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.stats{margin-left:0;width:100%}}
</style></head><body>
<header>
 <div class="bar">
  <h1>Shirt <b>Studio</b></h1>
  <div class="tabs" id="tabs"><button data-t="rate">Rate</button><button data-t="mock">Mockups</button><button data-t="taste">Taste &amp; generate</button></div>
  <span class="stats" id="stats"></span>
 </div>
 <div class="bar" style="padding-top:0">
  <select id="fBatch"></select>
  <select id="fTrack"><option value="all">Both tracks</option><option value="personal">Fan art (personal)</option><option value="sell">Sellable</option></select>
  <select id="fVote"><option value="all">All votes</option><option value="0">Not rated yet</option><option value="1">Liked</option><option value="-1">Disliked</option><option value="qa">Flagged redo</option></select>
  <select id="fSort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="match">Best taste match</option></select>
  <button id="focusBtn" class="primary">Rate one by one</button>
  <span class="lbl" style="margin-left:6px">Shirt</span><span id="swatches" style="display:flex;gap:5px"></span>
  <span id="tplPick" class="tabs"></span>
 </div>
</header>
<div id="banner"></div>
<main id="main"></main>

<div id="focus" role="dialog" aria-modal="true">
 <div class="fhead"><span class="t" id="fTitle"></span><span class="lbl" id="fPos"></span><span id="fTpl" class="tabs"></span><span id="fSw" style="display:flex;gap:5px"></span><button id="fClose">Close (Esc)</button></div>
 <div class="hook" id="fHook"></div>
 <div class="fbody"><div class="fpane fflat" id="fFlat"></div><div class="fpane" id="fMock"></div></div>
 <div class="ffoot"><button id="fPrev">&larr; Prev</button><button class="down" id="fDown">&#128078; Dislike</button><button class="up" id="fUp">&#128077; Like</button><button class="qa" id="fQa">&#128295; Redo art</button><input id="fNote" placeholder="Why? (optional, steers the next batch)"><button id="fNext">Next &rarr;</button></div>
 <div class="keys">Keys: &uarr; or L like · &darr; or D dislike · R flag a bad render (typo, glitch) · &larr; &rarr; move · M switch mockup · N note · Esc close</div>
</div>
<div id="toast"></div>

const saveUi=()=>LS.set("studio-ui",{tab:ui.tab,color:ui.color,tpl:ui.tpl,batch:ui.batch,track:ui.track,vote:ui.vote,sort:ui.sort});

async function load(){
  for(const k in imgCache)if(k.startsWith("designs/"))delete imgCache[k];
  if(SERVER){S=await (await fetch("/api/state")).json()}
  else{S=Object.assign(S,EMBED||{});S.votes=LS.get("studio-votes",{});S.taste=computeTaste()}
  buildFilters();render();
  if(S.job&&S.job.running)poll();
}
function computeTaste(){ // mirror of tools/taste.py scores() for offline mode
  const out={};DIMS.forEach(d=>out[d]={});
  S.designs.forEach(d=>{const v=(S.votes[d.id]||{}).vote;if(!v)return;
    DIMS.forEach(k=>{const val=k==="track"?d.track:(d.attrs||{})[k];if(!val)return;const e=out[k][val]||(out[k][val]={like:0,dislike:0});e[v>0?"like":"dislike"]++})});
  DIMS.forEach(k=>Object.values(out[k]).forEach(e=>e.score=+((e.like-e.dislike)/(e.like+e.dislike+2)).toFixed(3)));return out}
function match(d){let s=0;DIMS.forEach(k=>{const val=k==="track"?d.track:(d.attrs||{})[k];s+=((S.taste[k]||{})[val]||{}).score||0});return s}

async function vote(id,patch){
  const e=Object.assign({},S.votes[id]||{},patch,{ts:Date.now()/1000});S.votes[id]=e;
  if(SERVER){fetch("/api/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({id},patch))}).then(r=>{if(!r.ok)toast("Save failed")}).catch(()=>toast("Server not reachable: vote not saved"))}
  else LS.set("studio-votes",S.votes);
  S.taste=computeTaste();
}

function buildFilters(){
  const b=[...new Set(S.designs.map(d=>d.batch||1))].sort((a,c)=>a-c);
  $("#fBatch").innerHTML=`<option value="all">All batches</option>`+b.map(x=>`<option value="${x}">Batch ${x} (${S.designs.filter(d=>(d.batch||1)==x).length})</option>`).join("");
  [["#fBatch","batch"],["#fTrack","track"],["#fVote","vote"],["#fSort","sort"]].forEach(([s,k])=>{const el=$(s);el.value=ui[k];if(el.value!==String(ui[k])){ui[k]="all";el.value="all"}el.onchange=()=>{ui[k]=el.value;saveUi();render()}});
  const sw=$("#swatches");sw.innerHTML="";
  Object.entries(COLORS).forEach(([n,c])=>{const b=document.createElement("button");b.className="sw";b.title=n;b.style.background=c;b.onclick=()=>{ui.color=n;saveUi();render()};sw.append(b)});
}
function list(){
  let l=S.designs.filter(d=>(ui.batch==="all"||String(d.batch||1)===ui.batch)&&(ui.track==="all"||d.track===ui.track)&&
    (ui.vote==="all"||(ui.vote==="qa"?(S.votes[d.id]||{}).qa==="redo":String((S.votes[d.id]||{}).vote||0)===ui.vote)));
  const idx=new Map(S.designs.map((d,i)=>[d.id,i]));
  if(ui.sort==="new")l.sort((a,b)=>(b.batch||1)-(a.batch||1)||idx.get(a.id)-idx.get(b.id));
  if(ui.sort==="match")l.sort((a,b)=>match(b)-match(a));
  return l}

function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===ui.tab));
  document.querySelectorAll("#swatches .sw").forEach(b=>b.classList.toggle("on",b.title===ui.color));
  const tp=$("#tplPick");tp.innerHTML=ui.tab==="mock"?S.templates.map(t=>`<button data-tpl="${t.name}" class="${t.name===ui.tpl?"on":""}">${TPL_NAMES[t.name]||t.name}</button>`).join(""):"";
  tp.querySelectorAll("button").forEach(b=>b.onclick=()=>{ui.tpl=b.dataset.tpl;saveUi();render()});
  stats();
  $("#banner").innerHTML=SERVER?"":`<div class="banner">Offline view: votes stay in this browser and can't start new batches. Double-click <b>Shirt Studio.cmd</b> for the full app.</div>`;
  ({rate:renderRate,mock:renderMock,taste:renderTaste})[ui.tab]();
}
function stats(){const v=Object.values(S.votes);
  $("#stats").textContent=`${S.designs.filter(d=>d.ready).length}/${S.designs.length} drawn · ${v.filter(x=>x.vote===1).length} liked · ${v.filter(x=>x.vote===-1).length} disliked · ${S.designs.filter(d=>!(S.votes[d.id]||{}).vote).length} to rate`}

function cardChips(d){return `<div class="chips"><span class="chip ${d.track}">${d.track==="sell"?"Sellable":"Fan art"}</span><span class="chip">${esc(d.style)}</span>${d.batch>1?`<span class="chip new">Batch ${d.batch}</span>`:""}</div>`}
function renderRate(){
  const m=$("#main"),l=list();
  if(!l.length){m.innerHTML=`<div class="empty">Nothing matches these filters.</div>`;return}
  m.innerHTML=`<div class="grid">${l.map(d=>{const e=S.votes[d.id]||{};return `<div class="card v${e.vote||0}" data-id="${d.id}">
   <div class="shirt" style="background:${COLORS[ui.color]}">${d.ready?`<img loading="lazy" src="designs/preview/${d.id}.png" alt="${esc(d.title)}">`:`<span class="miss">being drawn…</span>`}</div>
   <div class="body"><span class="title">${esc(d.title)}</span>${cardChips(d)}<span class="hook">${esc(d.hook)}</span>
   ${(d.notes||[]).filter(n=>n.startsWith("CHECK")).map(n=>`<span class="warnnote">${esc(n)}</span>`).join("")}
   <div class="vote"><button class="down ${e.vote===-1?"on":""}" data-a="down" title="Dislike">&#128078;</button><button class="up ${e.vote===1?"on":""}" data-a="up" title="Like">&#128077;</button><button class="qa ${e.qa==="redo"?"on":""}" data-a="qa" title="Flag a bad render (typo or glitch) to redraw it. Doesn't affect your taste.">&#128295;</button></div>
   ${e.vote?`<input class="note" data-a="note" placeholder="Why? (optional)" value="${esc(e.note||"")}">`:""}
   <div class="more">${d.listing?`<button data-a="copy">Copy listing</button>`:""}<button data-a="print" ${d.ready?"":"disabled"}>Print file</button></div></div></div>`}).join("")}</div>`;
  m.querySelectorAll(".card").forEach(c=>{const id=c.dataset.id,d=S.designs.find(x=>x.id===id);
    c.querySelector(".shirt").onclick=()=>openFocus(id);
    c.querySelectorAll("[data-a]").forEach(b=>{const a=b.dataset.a;
      if(a==="note"){b.onchange=()=>vote(id,{note:b.value});return}
      b.onclick=()=>{const e=S.votes[id]||{};
        if(a==="up"||a==="down"){const val=a==="up"?1:-1;vote(id,{vote:e.vote===val?0:val});render()}
        if(a==="qa"){vote(id,{qa:e.qa==="redo"?"":"redo"});render()}
        if(a==="copy"){navigator.clipboard.writeText(d.listing+"\nTags: "+d.tags.join(", "));toast("Listing copied")}
        if(a==="print")window.open(`designs/print/${id}.png`)}})});
}

/* ---------- mockups (canvas, same maths as tools/mockups.py) ---------- */
const imgCache={};
function img(src){return imgCache[src]||(imgCache[src]=new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src}))}
function tplMeta(name){return S.templates.find(t=>t.name===name)||S.templates[0]}
async function drawMock(cv,d,tplName,colorName,width){
  const t=tplMeta(tplName);if(!t)return;
  const [photo,shade]=await Promise.all([img(`mockups/tpl/${t.name}.jpg`),img(`mockups/tpl/${t.name}.png`)]);
  const W=width||t.w,k=W/t.w,H=Math.round(t.h*k);cv.width=W;cv.height=H;
  const c=cv.getContext("2d");c.drawImage(photo,0,0,W,H);
  const A=new OffscreenCanvas(W,H),a=A.getContext("2d");
  a.fillStyle=COLORS[colorName]||colorName;a.fillRect(0,0,W,H);a.globalCompositeOperation="multiply";a.drawImage(shade,0,0,W,H);
  a.globalCompositeOperation="destination-in";a.drawImage(shade,0,0,W,H);c.drawImage(A,0,0);
  if(!d.ready)return;
  const di=await img(`designs/preview/${d.id}.png`);
  const r={x:t.print.x*k,y:t.print.y*k,w:t.print.w*k,h:t.print.h*k};
  const s=Math.min(r.w/di.width,r.h/di.height),dw=di.width*s,dh=di.height*s,dx=(r.w-dw)/2;
  const B=new OffscreenCanvas(Math.ceil(r.w),Math.ceil(r.h)),b=B.getContext("2d");
  b.drawImage(shade,t.print.x,t.print.y,t.print.w,t.print.h,0,0,r.w,r.h);
  b.globalCompositeOperation="multiply";b.drawImage(di,dx,0,dw,dh);
  b.globalCompositeOperation="destination-in";b.drawImage(di,dx,0,dw,dh);
  c.globalAlpha=.97;c.drawImage(B,r.x,r.y);c.globalAlpha=1;
}
let mockObs;
function renderMock(){
  const m=$("#main"),l=list().filter(d=>d.ready),t=tplMeta(ui.tpl);
  if(!t){m.innerHTML=`<div class="empty">No mockup templates yet. Run <code>tools/mockups.py prep</code>.</div>`;return}
  m.innerHTML=`<div class="gen" style="margin-top:0">${SERVER?`<button id="expLiked">Export full-size mockups of liked designs</button><button id="expShown">Export the ${l.length} shown</button><span class="lbl">JPGs go to mockups/out (${TPL_NAMES[t.name]}, ${ui.color})</span>`:""}</div>
   <div class="grid">${l.map(d=>`<div class="card mock" data-id="${d.id}"><canvas style="--ar:${t.w}/${t.h}"></canvas><div class="body"><span class="title">${esc(d.title)}</span>
   <button data-a="up" class="${(S.votes[d.id]||{}).vote===1?"on":""}" title="Like">&#128077;</button><button data-a="dl" title="Download this mockup">&#11015;</button></div></div>`).join("")}</div>`;
  mockObs&&mockObs.disconnect();
  mockObs=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;mockObs.unobserve(e.target);const id=e.target.closest(".card").dataset.id;
    drawMock(e.target,S.designs.find(d=>d.id===id),ui.tpl,ui.color,520)}),{rootMargin:"300px"});
  m.querySelectorAll(".card").forEach(c=>{const id=c.dataset.id,d=S.designs.find(x=>x.id===id),cv=c.querySelector("canvas");mockObs.observe(cv);
    cv.onclick=()=>openFocus(id);
    c.querySelector('[data-a="up"]').onclick=e=>{const v=(S.votes[id]||{}).vote===1?0:1;vote(id,{vote:v});e.target.classList.toggle("on",v===1);stats()};
    c.querySelector('[data-a="dl"]').onclick=()=>download(d)});
  const ex=(ids)=>fetch("/api/mockups",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ids,tpl:[ui.tpl],colors:[ui.color]})}).then(r=>r.json()).then(j=>{toast(j.ok?"Rendering… see Taste & generate for progress":"Another job is running");poll()});
  if(SERVER){$("#expLiked").onclick=()=>ex(null);$("#expShown").onclick=()=>ex(l.map(d=>d.id))}
}
async function download(d){const cv=document.createElement("canvas");await drawMock(cv,d,ui.tpl,ui.color);
  cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`${d.id}__${ui.tpl}__${ui.color}.jpg`;a.click()},"image/jpeg",.9)}

/* ---------- focus mode ---------- */
let fList=[];
function openFocus(id){fList=list();ui.focus=Math.max(0,fList.findIndex(d=>d.id===id));$("#focus").classList.add("open");drawFocus()}
function closeFocus(){$("#focus").classList.remove("open");ui.focus=-1;render()}
function drawFocus(){
  const d=fList[ui.focus];if(!d)return closeFocus();const e=S.votes[d.id]||{};
  $("#fTitle").textContent=d.title;$("#fPos").textContent=`${ui.focus+1} / ${fList.length}`;$("#fHook").innerHTML=esc(d.hook)+((d.notes||[]).some(n=>n.startsWith("CHECK"))?` <span class="warnnote">· background may need cleanup</span>`:"");
  $("#fFlat").style.background=COLORS[ui.color];
  $("#fFlat").innerHTML=d.ready?`<img src="designs/preview/${d.id}.png" alt="">`:`<span class="miss">being drawn…</span>`;
  $("#fMock").innerHTML=S.templates.length&&d.ready?"<canvas></canvas>":"";const cv=$("#fMock canvas");if(cv)drawMock(cv,d,ui.tpl,ui.color,900);
  $("#fUp").classList.toggle("on",e.vote===1);$("#fDown").classList.toggle("on",e.vote===-1);$("#fQa").classList.toggle("on",e.qa==="redo");
  $("#fNote").value=e.note||"";
  $("#fTpl").innerHTML=S.templates.map(t=>`<button data-tpl="${t.name}" class="${t.name===ui.tpl?"on":""}" style="background:#222228;color:#eee;border-color:${t.name===ui.tpl?"var(--acc)":"#3a3a44"}">${TPL_NAMES[t.name]||t.name}</button>`).join("");
  $("#fTpl").querySelectorAll("button").forEach(b=>b.onclick=()=>{ui.tpl=b.dataset.tpl;saveUi();drawFocus()});
  $("#fSw").innerHTML=Object.entries(COLORS).map(([n,c])=>`<button class="sw ${n===ui.color?"on":""}" title="${n}" style="background:${c}"></button>`).join("");
  $("#fSw").querySelectorAll("button").forEach(b=>b.onclick=()=>{ui.color=b.title;saveUi();drawFocus()});
}
function fMove(n){ui.focus=Math.min(fList.length-1,Math.max(0,ui.focus+n));drawFocus()}
function fVote(val){const d=fList[ui.focus];const e=S.votes[d.id]||{};const nv=e.vote===val?0:val;vote(d.id,{vote:nv});drawFocus();if(nv&&ui.focus<fList.length-1)setTimeout(()=>fMove(1),260)}
$("#fUp").onclick=()=>fVote(1);$("#fDown").onclick=()=>fVote(-1);$("#fPrev").onclick=()=>fMove(-1);$("#fNext").onclick=()=>fMove(1);$("#fClose").onclick=closeFocus;
$("#fQa").onclick=()=>{const d=fList[ui.focus];vote(d.id,{qa:(S.votes[d.id]||{}).qa==="redo"?"":"redo"});drawFocus()};
$("#fNote").onchange=e=>vote(fList[ui.focus].id,{note:e.target.value});
document.addEventListener("keydown",e=>{
  if(ui.focus<0)return;if(e.target.tagName==="INPUT"){if(e.key==="Escape"||e.key==="Enter")e.target.blur();return}
  const k=e.key.toLowerCase();
  if(k==="escape")closeFocus();else if(k==="arrowright")fMove(1);else if(k==="arrowleft")fMove(-1);
  else if(k==="arrowup"||k==="l")fVote(1);else if(k==="arrowdown"||k==="d")fVote(-1);else if(k==="r")$("#fQa").click();
  else if(k==="n"){e.preventDefault();$("#fNote").focus()}
  else if(k==="m"&&S.templates.length){const i=S.templates.findIndex(t=>t.name===ui.tpl);ui.tpl=S.templates[(i+1)%S.templates.length].name;saveUi();drawFocus()}
  else return;e.preventDefault()});
$("#focusBtn").onclick=()=>{const l=list();const first=l.find(d=>!(S.votes[d.id]||{}).vote&&d.ready)||l[0];if(first)openFocus(first.id)};

function bars(dim){const e=Object.entries(S.taste[dim]||{}).sort((a,b)=>b[1].score-a[1].score);
  if(!e.length)return `<div class="lbl">No votes yet.</div>`;
  return e.map(([v,x])=>{const w=Math.abs(x.score)*50,pos=x.score>=0;return `<div class="brow"><span>${esc(v)}</span><div class="btrack"><div class="bfill" style="${pos?"left:50%":"right:50%"};width:${w}%;background:${pos?"var(--up)":"var(--down)"}"></div></div><span class="bnum">${x.like}&#128077; ${x.dislike}&#128078;</span></div>`}).join("")}
async function renderTaste(){
  const m=$("#main"),j=S.job||{},flagged=Object.values(S.votes).filter(v=>v.qa==="redo").length;
  const rated=Object.values(S.votes).filter(v=>v.vote).length;
  m.innerHTML=`<div class="tgrid">
   <div class="panel" style="grid-column:1/-1"><h3>Generate the next batch</h3>
    <div class="hook">The planner samples formats, art styles, subjects, humor and palettes from the bars below: liked values come up about 9x more often than disliked ones, and 1 in 5 picks is random so new things still get tried. Your notes go to Codex with the plan. ${rated<10?`<b>Rate at least 10 designs first for a useful signal (${rated} so far).</b>`:""}</div>
    <div class="gen"><span class="lbl">How many</span><select id="gN"><option>5</option><option selected>10</option><option>20</option></select>
     <span class="lbl">Track</span><select id="gT"><option value="auto">Match my likes</option><option value="personal">Fan art only</option><option value="sell">Sellable only</option></select>
     <button class="primary" id="gGo" ${!SERVER||j.running?"disabled":""}>Generate from my taste</button>
     <button id="gRedo" ${!SERVER||j.running||!flagged?"disabled":""}>Redraw ${flagged} flagged</button>
     <span class="lbl">Codex writes the prompts and draws the art on your ChatGPT plan, about 2 min per design.</span></div>
    <div id="plan"></div>
    <div id="jobBox">${jobHtml(j)}</div></div>
   ${DIMS.map(d=>`<div class="panel"><h3>${d==="art"?"Art style":d}</h3>${bars(d)}</div>`).join("")}</div>`;
  if(!SERVER)return;
  $("#gGo").onclick=async()=>{const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({n:+$("#gN").value,track:$("#gT").value})});toast(r.ok?"Batch started":"A job is already running");poll()};
  $("#gRedo").onclick=async()=>{await fetch("/api/redo",{method:"POST"});toast("Redraw started");poll()};
  const p=await (await fetch("/api/plan?n=10")).json();
  $("#plan").innerHTML=`<div class="lbl" style="margin-top:4px">Sample plan from your current taste:</div><ol class="slots">${p.map(s=>`<li>${s.track==="sell"?"Sellable":"Fan art"} · ${s.format} · ${s.art} · ${s.subject} · ${s.humor} · ${s.palette}</li>`).join("")}</ol>`;
}
function jobHtml(j){if(!j||!j.step&&!(j.tail||[]).length)return "";
  return `<div class="lbl" style="margin-top:10px">${j.running?'<span class="spin"></span>':""}<b>${esc(j.step||"")}</b></div><div class="log">${esc([...(j.log||[]).slice(-14),...(j.tail||[]).length?["— output —",...j.tail]:[]].join("\n"))}</div>`}
let pollT;
function poll(){clearTimeout(pollT);pollT=setTimeout(async()=>{const j=await (await fetch("/api/job")).json();S.job=j;
  const box=$("#jobBox");if(box)box.innerHTML=jobHtml(j);
  if(j.running)poll();else{await load();toast(j.state==="failed"?"Job failed: see log":"Job finished")}},3000)}

document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{ui.tab=b.dataset.t;saveUi();render()});
load();
</script></body></html>
